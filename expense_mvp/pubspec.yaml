name: expense_mvp
description: MVP de gestión de gastos personales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado
  flutter_riverpod: ^2.4.9

  # Persistencia cifrada
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.8.3
  path_provider: ^2.1.1

  # Firebase (opcional, funciona con fallback demo)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Seguridad
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  crypto: ^3.0.3

  # Multimedia
  image_picker: ^1.0.5

  # Notificaciones
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.3

  # Terceros (cumple requisito ≥2)
  intl: ^0.19.0
  fl_chart: ^0.66.0
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true